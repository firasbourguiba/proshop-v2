version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: proshop-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - proshop-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proshop-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: abc123
      PAYPAL_CLIENT_ID: sb
    depends_on:
      - mongo
    networks:
      - proshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proshop-frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - proshop-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: proshop-nginx
    restart: always
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend
    networks:
      - proshop-network

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: proshop-prometheus
    restart: always
    ports:
      - '9090:9090'
    networks:
      - proshop-network

  grafana:
    image: grafana/grafana:latest
    container_name: proshop-grafana
    restart: always
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - proshop-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: proshop-node-exporter
    restart: always
    ports:
      - '9100:9100'
    networks:
      - proshop-network

volumes:
  mongo-data:
  grafana-data:

networks:
  proshop-network:
    driver: bridge